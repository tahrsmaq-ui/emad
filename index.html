<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مطعم عماد الدين | القائمة الرقمية</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #050d08;
      --bg-surface: #0d1f14;
      --bg-card: rgba(15, 36, 24, 0.9);
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --gold-gradient: linear-gradient(135deg, #d4af37, #f3e5ab, #aa771c);
      --text-main: #f0fdf4;
      --text-muted: #86efac;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      direction: rtl;
      padding-bottom: 40px;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(212, 175, 55, 0.07) 0%, transparent 40%);
      background-attachment: fixed;
    }

    .top-header {
      background: linear-gradient(180deg, #081a10 0%, var(--bg-surface) 100%);
      padding: 15px 20px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .header-content {
      max-width: 1250px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand-icon-box {
      width: 45px;
      height: 45px;
      background: var(--gold-gradient);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--bg-main);
      font-size: 20px;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
    }

    .brand-titles h1 {
      font-size: 1.35rem;
      font-weight: 900;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-titles p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .currency-switcher {
      display: flex;
      background: rgba(5, 13, 8, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 30px;
      padding: 3px;
      gap: 3px;
    }

    .curr-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .curr-btn.active {
      background: var(--gold-gradient);
      color: var(--bg-main);
    }

    .floating-cart-btn {
      position: relative;
      background: var(--gold-gradient);
      color: var(--bg-main);
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
    }

    .cart-badge-count {
      position: absolute;
      top: -5px;
      left: -5px;
      background: #ef4444;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 900;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--bg-main);
      display: none;
    }

    /* تخطيط الصفحة: القائمة الجانبية (Sidebar) مع المحتوى */
    .layout-container {
      max-width: 1250px;
      margin: 20px auto;
      padding: 0 15px;
      display: flex;
      gap: 25px;
      align-items: flex-start;
    }

    /* الشريط الجانبي للتصنيفات */
    .sidebar-categories {
      width: 240px;
      background: var(--bg-surface);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 18px;
      padding: 15px;
      position: sticky;
      top: 85px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--gold-primary);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cat-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cat-item-btn {
      background: rgba(15, 36, 24, 0.6);
      color: var(--text-muted);
      border: 1px solid rgba(212, 175, 55, 0.1);
      padding: 10px 14px;
      border-radius: 12px;
      text-align: right;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cat-item-btn.active, .cat-item-btn:hover {
      background: var(--gold-gradient);
      color: var(--bg-main);
      border-color: transparent;
      transform: translateX(-4px);
    }

    /* قسم المحتوى الرئيسي والبحث */
    .main-content-area {
      flex-grow: 1;
    }

    .search-bar {
      position: relative;
      margin-bottom: 20px;
    }

    .search-bar i {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold-primary);
    }

    .search-input {
      width: 100%;
      padding: 12px 45px 12px 20px;
      background: var(--bg-card);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .search-input:focus {
      border-color: var(--gold-primary);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 18px;
    }

    .food-card {
      background: var(--bg-card);
      border-radius: 16px;
      border: 1px solid rgba(212, 175, 55, 0.12);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      transition: transform 0.3s, border-color 0.3s;
    }

    .food-card:hover {
      transform: translateY(-4px);
      border-color: var(--gold-primary);
    }

    .card-top-info {
      padding: 16px 16px 10px;
    }

    .item-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
      gap: 10px;
    }

    .item-name {
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
    }

    .item-price-tag {
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: var(--gold-primary);
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .item-desc {
      color: #86efac;
      font-size: 0.82rem;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .card-footer-action {
      padding: 10px 16px;
      background: rgba(5, 13, 8, 0.4);
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .add-btn {
      width: 100%;
      background: var(--gold-gradient);
      color: var(--bg-main);
      border: none;
      padding: 9px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    .qty-box {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(5, 13, 8, 0.8);
      border: 1px solid var(--gold-primary);
      border-radius: 10px;
      padding: 4px 10px;
    }

    .q-btn {
      background: var(--gold-gradient);
      color: var(--bg-main);
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .q-val {
      font-weight: 900;
      font-size: 1rem;
      color: #fff;
    }

    /* نافذة السلة */
    .cart-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(5px);
      z-index: 2000;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .cart-overlay.open {
      display: block;
      opacity: 1;
    }

    .cart-drawer-panel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      max-width: 600px;
      margin: 0 auto;
      background: #091c12;
      border-top: 2px solid var(--gold-primary);
      border-radius: 25px 25px 0 0;
      padding: 25px;
      z-index: 2001;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .cart-overlay.open .cart-drawer-panel {
      transform: translateY(0);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    .drawer-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .close-drawer {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 24px;
      cursor: pointer;
    }

    .cart-items-container {
      overflow-y: auto;
      margin: 15px 0;
      max-height: 220px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-left: 5px;
    }

    .cart-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 36, 24, 0.7);
      border: 1px solid rgba(212, 175, 55, 0.15);
      padding: 10px 14px;
      border-radius: 12px;
    }

    .cart-item-info h4 {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .cart-item-info span {
      font-size: 0.85rem;
      color: var(--gold-primary);
      font-weight: 800;
    }

    .cart-options-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    .select-style, .input-style {
      width: 100%;
      padding: 11px 15px;
      background: rgba(15, 36, 24, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 10px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .cart-total-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-top: 10px;
      border-top: 1px dashed rgba(255,255,255,0.1);
    }

    .cart-total-footer span {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .cart-total-footer strong {
      font-size: 1.2rem;
      color: var(--gold-primary);
      font-weight: 900;
    }

    .whatsapp-send-btn {
      width: 100%;
      background: #25d366;
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
      text-decoration: none;
    }

    .status-msg {
      text-align: center;
      padding: 50px;
      color: var(--text-muted);
      grid-column: 1 / -1;
      font-size: 1.1rem;
    }

    /* للشاشات الصغيرة (الموبايل): تصبح الأقسام أفقية عائمة لتوفير المساحة */
    @media (max-width: 768px) {
      .layout-container {
        flex-direction: column;
      }
      .sidebar-categories {
        width: 100%;
        position: static;
        overflow-x: auto;
        white-space: nowrap;
        display: flex;
        gap: 8px;
        padding: 10px;
      }
      .cat-list {
        flex-direction: row;
      }
      .sidebar-title {
        display: none;
      }
      .cat-item-btn {
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>

  <header class="top-header">
    <div class="header-content">
      <div class="brand-area">
        <div class="brand-icon-box"><i class="fa-solid fa-crown"></i></div>
        <div class="brand-titles">
          <h1>مطعم عماد الدين</h1>
          <p>أشهى المأكولات الشرقية والغربية</p>
        </div>
      </div>
      
      <div class="header-actions">
        <!-- زر تبديل العملة -->
        <div class="currency-switcher">
          <button class="curr-btn active" id="btn-syr" onclick="switchCurrency('syr')">ل.س</button>
          <button class="curr-btn" id="btn-try" onclick="switchCurrency('try')">TL</button>
        </div>

        <!-- زر سلة الطلبات العائم -->
        <button class="floating-cart-btn" onclick="toggleCartDrawer(true)">
          <i class="fa-solid fa-basket-shopping"></i>
          <span class="cart-badge-count" id="badgeCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- تخطيط الصفحة: القائمة الجانبية + محتوى الوجبات -->
  <div class="layout-container">
    
    <!-- الشريط الجانبي للتصنيفات (Sidebar) -->
    <aside class="sidebar-categories">
      <div class="sidebar-title">
        <i class="fa-solid fa-bars-staggered"></i> الأقسام
      </div>
      <div class="cat-list" id="categoriesBar">
        <button class="cat-item-btn active" onclick="filterCategory('الكل', this)">الكل</button>
      </div>
    </aside>

    <!-- المحتوى الرئيسي (البحث والوجبات) -->
    <div class="main-content-area">
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن وجبتك المفضلة..." oninput="renderMenu()">
      </div>

      <main id="menuContainer" class="menu-grid">
        <div class="status-msg"><i class="fas fa-spinner fa-spin"></i> جاري تحميل القائمة من غوغل شيتس...</div>
      </main>
    </div>

  </div>

  <!-- نافذة السلة الجانبية المبتكرة -->
  <div class="cart-overlay" id="cartOverlay" onclick="toggleCartDrawer(false)">
    <div class="cart-drawer-panel" onclick="event.stopPropagation()">
      <div class="drawer-header">
        <div class="drawer-title">
          <i class="fa-solid fa-bag-shopping"></i> حقيبة الطلبات المختارة
        </div>
        <button class="close-drawer" onclick="toggleCartDrawer(false)">&times;</button>
      </div>

      <div class="cart-items-container" id="cartItemsList">
        <div style="text-align: center; color: #86efac; padding: 20px;">السلة فارغة حالياً</div>
      </div>

      <div class="cart-options-area">
        <select id="orderType" class="select-style">
          <option value="توصيل للمنزل">🚴‍♂️ توصيل للمنزل</option>
          <option value="استلام من المطعم">🏪 استلام من المطعم</option>
          <option value="سفري">📦 طعام سفري</option>
          <option value="صالة">🍽️ طلب داخل الصالة</option>
        </select>
        <input type="text" id="orderNotes" class="input-style" placeholder="عنوان التوصيل أو ملاحظات إضافية...">
      </div>

      <div class="cart-total-footer">
        <span>المجموع الكلي:</span>
        <strong id="drawerTotalSum">0 ل.س</strong>
      </div>

      <a href="#" id="whatsappSendBtn" class="whatsapp-send-btn" target="_blank" onclick="sendWhatsAppOrder()">
        <i class="fab fa-whatsapp" style="font-size: 1.2rem;"></i> إرسال الطلب عبر الواتساب
      </a>
    </div>
  </div>

  <script>
    let fullMenuData = [];
    let cart = {};
    let currentCategory = 'الكل';
    let currentCurrency = 'syr';

    const SHEET_ID = '1w1jxybn50MUJWVXRH5tWv0AvMdl6KRhXXoLmtgXfuvI';
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
    const WHATSAPP_NUMBER = '963948893053';

    async function loadMenu() {
      try {
        let response = await fetch(GVIZ_URL);
        let text = await response.text();
        let jsonText = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        let json = JSON.parse(jsonText);
        let rows = json.table.rows;

        let parsed = [];
        rows.forEach(row => {
          let cells = row.c;
          if (cells && cells[0] && cells[0].v && cells[0].v !== 'title') {
            let title = cells[0] ? cells[0].v.toString().trim() : '';
            let priceTry = (cells[1] && cells[1].v !== null) ? parseFloat(cells[1].v) : 0;
            let priceSyr = (cells[2] && cells[2].v !== null) ? parseFloat(cells[2].v) : 0;
            let category = (cells[3] && cells[3].v) ? cells[3].v.toString().trim() : 'وجبات عامة';
            let description = (cells[4] && cells[4].v) ? cells[4].v.toString().trim() : 'مجهّزة طازجة يومياً بأعلى جودة';

            if (title) {
              parsed.push({ title, priceTry, priceSyr, category, description });
            }
          }
        });

        if (parsed.length > 0) {
          fullMenuData = parsed;
        }
      } catch (e) {
        fullMenuData = [
          { title: "وجبة شاورما دبل", priceTry: 240, priceSyr: 72000, category: "وجبات شاورما", description: "شاورما دجاج 220غ + بطاطا" },
          { title: "كوكا كولا", priceTry: 70, priceSyr: 21000, category: "مشروبات", description: "عبوة باردة" }
        ];
      }

      buildCategoriesNav();
      renderMenu();
    }

    function switchCurrency(curr) {
      currentCurrency = curr;
      document.getElementById('btn-syr').classList.toggle('active', curr === 'syr');
      document.getElementById('btn-try').classList.toggle('active', curr === 'try');
      renderMenu();
      updateCartUI();
    }

    function buildCategoriesNav() {
      const container = document.getElementById('categoriesBar');
      const cats = ['الكل', ...new Set(fullMenuData.map(i => i.category))];
      
      container.innerHTML = cats.map(cat => `
        <button class="cat-item-btn ${cat === currentCategory ? 'active' : ''}" onclick="filterCategory('${cat}', this)">${cat}</button>
      `).join('');
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll('.cat-item-btn').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = cat;
      renderMenu();
    }

    function renderMenu() {
      const container = document.getElementById('menuContainer');
      const searchVal = document.getElementById('searchInput').value.toLowerCase();

      const filtered = fullMenuData.filter(item => {
        const matchesCat = currentCategory === 'الكل' || item.category === currentCategory;
        const matchesSearch = item.title.toLowerCase().includes(searchVal) || item.description.toLowerCase().includes(searchVal);
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="status-msg">لا توجد وجبات مطابقة للبحث حالياً</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        let priceVal = currentCurrency === 'syr' ? `${item.priceSyr.toLocaleString()} ل.س` : `${item.priceTry.toLocaleString()} TL`;
        let qty = cart[item.title] ? cart[item.title].qty : 0;
        let encodedTitle = encodeURIComponent(item.title);

        return `
          <div class="food-card">
            <div class="card-top-info">
              <div class="item-header-row">
                <span class="item-name">${item.

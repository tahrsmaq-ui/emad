<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مطعم عماد الدين | Imad Al-Din Restaurant</title>
  
  <!-- Google Fonts: Cairo & Tajawal -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #080808;
      --card-bg: rgba(20, 20, 20, 0.75);
      --primary-yellow: #ffd700;
      --accent-gold: #ffb700;
      --text-main: #ffffff;
      --text-muted: #a0a0a0;
      --border-color: rgba(255, 215, 0, 0.2);
      --glow-shadow: 0 0 20px rgba(255, 215, 0, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(255, 215, 0, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(255, 183, 0, 0.04) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Navigation */
    header {
      background: rgba(12, 12, 12, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      transition: all 0.3s ease;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--text-main);
    }

    .logo span {
      color: var(--primary-yellow);
      background: linear-gradient(135deg, #ffe066, #ffb700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
    }

    .currency-selector {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 215, 0, 0.05);
      padding: 8px 16px;
      border-radius: 50px;
      border: 1px solid var(--border-color);
      transition: border-color 0.3s ease;
    }

    .currency-selector:hover {
      border-color: var(--primary-yellow);
    }

    .currency-selector label {
      font-size: 14px;
      color: var(--primary-yellow);
      font-weight: 600;
    }

    .currency-selector select {
      background: #111;
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: all 0.3s ease;
    }

    .currency-selector select:focus {
      border-color: var(--primary-yellow);
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
    }

    /* Hero Banner */
    .hero {
      text-align: center;
      padding: 70px 20px 40px 20px;
      position: relative;
    }

    .hero h1 {
      font-size: 44px;
      font-weight: 900;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .hero h1 span {
      color: var(--primary-yellow);
    }

    .hero p {
      font-size: 18px;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
      font-weight: 400;
    }

    .divider {
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--primary-yellow), transparent);
      margin: 25px auto 0 auto;
      border-radius: 2px;
    }

    /* Container & Section */
    .container {
      max-width: 1150px;
      margin: 30px auto 60px auto;
      padding: 0 25px;
      flex: 1;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 35px;
    }

    .section-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--primary-yellow);
      position: relative;
      padding-right: 15px;
    }

    .section-title::before {
      content: '';
      position: absolute;
      right: 0;
      top: 15%;
      height: 70%;
      width: 4px;
      background: var(--primary-yellow);
      border-radius: 2px;
      box-shadow: 0 0 10px var(--primary-yellow);
    }

    /* Grid & Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 30px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      overflow: hidden;
      backdrop-filter: blur(10px);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: var(--primary-yellow);
      box-shadow: var(--glow-shadow);
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      height: 200px;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover img {
      transform: scale(1.08);
    }

    .card-content {
      padding: 22px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 21px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 20px;
      flex: 1;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .price-tag {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary-yellow);
      background: rgba(255, 215, 0, 0.1);
      padding: 6px 14px;
      border-radius: 30px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      letter-spacing: 0.5px;
    }

    .btn-order {
      background: linear-gradient(135deg, #ffd700 0%, #ffb700 100%);
      color: #000000;
      border: none;
      padding: 9px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(255, 215, 0, 0.2);
    }

    .btn-order:hover {
      background: linear-gradient(135deg, #ffffff 0%, #ffd700 100%);
      box-shadow: 0 6px 18px rgba(255, 215, 0, 0.4);
      transform: scale(1.04);
    }

    /* Footer */
    footer {
      background: #040404;
      text-align: center;
      padding: 25px;
      border-top: 1px solid rgba(255, 215, 0, 0.15);
      color: #666;
      font-size: 14px;
      margin-top: auto;
    }

    footer p span {
      color: var(--primary-yellow);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      header {
        padding: 15px 20px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .hero p {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="logo">مطعم <span>عماد الدين</span></div>
    
    <div class="currency-selector">
      <label for="currency">العملة:</label>
      <select id="currency" onchange="updatePrices()">
        <option value="TRY">ليرة تركية (TL)</option>
        <option value="SYP">ليرة سورية (SYP)</option>
      </select>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>تجربة طعام <span>استثنائية</span></h1>
    <p>أرقى المأكولات وأشهى الوجبات المحضرة بشغف وأعلى معايير الجودة</p>
    <div class="divider"></div>
  </section>

  <!-- Main Content Area -->
  <main class="container">
    <div class="section-header">
      <h2 class="section-title">قائمة الوجبات المختارة</h2>
    </div>
    
    <div class="grid" id="meals-grid">
      <!-- Meals cards will render here -->
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 جميع الحقوق محفوظة | <span>مطعم عماد الدين</span></p>
  </footer>

  <!-- JavaScript -->
  <script>
    const meals = [
      {
        id: 1,
        title: "وجبة شاورما اكسترا",
        desc: "شرائح شاورما الدجاج المتبلة مع جبنة الموزاريلا الفاخرة، الفطر، بطاطا، ثوم ومخلل مع لمسة دبس الرمان.",
        priceTRY: 200,
        priceSYP: 600,
        image: "https://images.unsplash.com/photo-1561651823-34feb02250e4?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 2,
        title: "وجبة كريسبي الذهبيه",
        desc: "قطع دجاج كريسبي المقرمشة الذهبية تقدم مع البطاطا المقرمشة، صوص الثوم الخاص وسلاطة الكولسلو.",
        priceTRY: 220,
        priceSYP: 660,
        image: "https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 3,
        title: "وجبة زنجر سوبريم",
        desc: "صدر دجاج زنجر المقرمش بالحار المميز، مع جبنة الشيدر الذائبة، بطاطا وسلاطة الكولسلو الطازجة.",
        priceTRY: 230,
        priceSYP: 690,
        image: "https://images.unsplash.com/photo-1625813506062-0aeb1d7a094b?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 4,
        title: "وجبة فاهيتا فاخرة",
        desc: "شرائح صدر دجاج مشوي مع الفلفل الألوان، البصل، الذرة الحلوة والجبنة الذائبة مع الصوص الخاص.",
        priceTRY: 250,
        priceSYP: 750,
        image: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 5,
        title: "وجبة مكسيكانو حار",
        desc: "دجاج متبل على الطريقة المكسيكية الحارة مع الفطر والبصل والصوص المكسيكي الغني.",
        priceTRY: 210,
        priceSYP: 630,
        image: "https://images.unsplash.com/photo-1509722747041-616f39b57569?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 6,
        title: "برغر عماد الدين المزدوج",
        desc: "شريحتا دجاج مشوية مع الجبنة الذائبة، المخلل والصوص الملكي داخل خبز ناعم وطازج.",
        priceTRY: 190,
        priceSYP: 570,
        image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80"
      }
    ];

    function renderMeals(selectedCurrency) {
      const grid = document.getElementById("meals-grid");
      grid.innerHTML = "";

      meals.forEach(meal => {
        const price = selectedCurrency === "TRY" 
          ? `${meal.priceTRY} TL` 
          : `${meal.priceSYP} ل.س`;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-img-wrapper">
            <img src="${meal.image}" alt="${meal.title}">
          </div>
          <div class="card-content">
            <h3 class="card-title">${meal.title}</h3>
            <p class="card-desc">${meal.desc}</p>
            <div class="card-footer">
              <span class="price-tag">${price}</span>
              <button class="btn-order">اطلب الآن</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function updatePrices() {
      const currencySelect = document.getElementById("currency");
      renderMeals(currencySelect.value);
    }

    window.onload = function() {
      renderMeals("TRY");
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مطعم عماد الدين - القائمة الرقمية</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #050d08;
      --bg-surface: #0d1f14;
      --bg-card: rgba(15, 36, 24, 0.9);
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --gold-gradient: linear-gradient(135deg, #d4af37, #f3e5ab, #aa771c);
      --text-light: #f0fdf4;
      --text-muted: #86efac;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      direction: rtl;
      padding-bottom: 50px;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(212, 175, 55, 0.07) 0%, transparent 40%);
      background-attachment: fixed;
    }

    /* الهيدر العلوي المطور (يضم الشعار، تبديل العملة، والسلة العلوية) */
    .top-header {
      background: linear-gradient(180deg, #081a10 0%, var(--bg-surface) 100%);
      padding: 15px 20px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .header-content {
      max-width: 1250px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand-icon-box {
      width: 48px;
      height: 48px;
      background: var(--gold-gradient);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--bg-dark);
      font-size: 22px;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
    }

    .brand-titles h1 {
      font-size: 1.4rem;
      font-weight: 900;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-titles p {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .currency-switcher {
      display: flex;
      background: rgba(5, 13, 8, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 30px;
      padding: 3px;
      gap: 3px;
    }

    .curr-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 5px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .curr-btn.active {
      background: var(--gold-gradient);
      color: var(--bg-dark);
    }

    /* زر السلة العلوي المبتكر */
    .top-cart-btn {
      position: relative;
      background: var(--gold-gradient);
      color: var(--bg-dark);
      border: none;
      padding: 8px 16px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
      transition: transform 0.2s;
    }

    .top-cart-btn:active {
      transform: scale(0.95);
    }

    .cart-badge-count {
      background: #ef4444;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 900;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* تخطيط الصفحة: القائمة الجانبية والمحتوى */
    .layout-container {
      max-width: 1250px;
      margin: 25px auto;
      padding: 0 15px;
      display: flex;
      gap: 25px;
      align-items: flex-start;
    }

    .sidebar-categories {
      width: 250px;
      background: var(--bg-surface);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 18px;
      padding: 15px;
      position: sticky;
      top: 95px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--gold-primary);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cat-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cat-item-btn {
      background: rgba(15, 36, 24, 0.6);
      color: var(--text-muted);
      border: 1px solid rgba(212, 175, 55, 0.1);
      padding: 10px 14px;
      border-radius: 12px;
      text-align: right;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .cat-item-btn.active, .cat-item-btn:hover {
      background: var(--gold-gradient);
      color: var(--bg-dark);
      border-color: transparent;
      transform: translateX(-4px);
    }

    .main-content-area {
      flex-grow: 1;
    }

    .loading-status {
      text-align: center;
      padding: 50px;
      color: var(--text-muted);
      font-size: 1.1rem;
      grid-column: 1 / -1;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--bg-card);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.15);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      transition: transform 0.3s, border-color 0.3s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--gold-primary);
    }

    .card-img-container {
      position: relative;
      width: 100%;
      background-color: #0f172a;
    }

    .card-img {
      width: 100%;
      height: 180px;
      display: block;
      object-fit: cover;
    }

    .price-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(5, 13, 8, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: var(--gold-primary);
      padding: 5px 12px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 0.9rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .card-title {
      color: #fff;
      font-size: 1.15rem;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .card-description {
      color: var(--text-muted);
      font-size: 0.86rem;
      line-height: 1.5;
      margin-bottom: 16px;
      flex-grow: 1;
    }

    .add-to-cart-btn {
      width: 100%;
      padding: 10px;
      background: var(--gold-gradient);
      color: var(--bg-dark);
      border: none;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-size: 0.92rem;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #07120a;
      border: 1px solid var(--gold-primary);
      border-radius: 10px;
      padding: 4px;
    }

    .qty-btn {
      background: var(--gold-gradient);
      color: var(--bg-dark);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 7px;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-count {
      font-weight: 900;
      color: #fff;
      font-size: 1.1rem;
    }

    /* نافذة السلة العلوية المنسدلة (Drawer / Modal) */
    .cart-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(5px);
      z-index: 2000;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .cart-overlay.open {
      display: block;
      opacity: 1;
    }

    .cart-drawer-panel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      max-width: 600px;
      margin: 0 auto;
      background: #091c12;
      border-top: 2px solid var(--gold-primary);
      border-radius: 25px 25px 0 0;
      padding: 25px;
      z-index: 2001;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .cart-overlay.open .cart-drawer-panel {
      transform: translateY(0);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    .drawer-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .close-drawer {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 24px;
      cursor: pointer;
    }

    .cart-items-container {
      overflow-y: auto;
      margin: 15px 0;
      max-height: 200px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-left: 5px;
    }

    .cart-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 36, 24, 0.7);
      border: 1px solid rgba(212, 175, 55, 0.15);
      padding: 10px 14px;
      border-radius: 12px;
    }

    .cart-item-info h4 {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .cart-item-info span {
      font-size: 0.85rem;
      color: var(--gold-primary);
      font-weight: 800;
    }

    .cart-options-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    .select-style, .input-style {
      width: 100%;
      padding: 11px 15px;
      background: rgba(15, 36, 24, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 10px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .cart-total-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-top: 10px;
      border-top: 1px dashed rgba(255,255,255,0.1);
    }

    .cart-total-footer span {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .cart-total-footer strong {
      font-size: 1.2rem;
      color: var(--gold-primary);
      font-weight: 900;
    }

    .whatsapp-send-btn {
      width: 100%;
      background: #25d366;
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
      text-decoration: none;
    }

    @media (max-width: 768px) {
      .layout-container {
        flex-direction: column;
      }
      .sidebar-categories {
        width: 100%;
        position: static;
        overflow-x: auto;
        white-space: nowrap;
        display: flex;
        gap: 8px;
        padding: 10px;
      }
      .cat-list {
        flex-direction: row;
      }
      .sidebar-title {
        display: none;
      }
      .cat-item-btn {
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>

  <!-- الهيدر العلوي يضم اسم المطعم، زر العملات، وزر السلة -->
  <header class="top-header">
    <div class="header-content">
      <div class="brand-area">
        <div class="brand-icon-box"><i class="fa-solid fa-crown"></i></div>
        <div class="brand-titles">
          <h1>مطعم عماد الدين</h1>
          <p>أطيب المأكولات الغربية والشاورما والمقبلات</p>
        </div>
      </div>
      
      <div class="header-actions">
        <!-- زر تبديل العملة العلوي -->
        <div class="currency-switcher">
          <button class="curr-btn active" id="btn-syr" onclick="switchCurrency('syr')">ل.س</button>
          <button class="curr-btn" id="btn-try" onclick="switchCurrency('try')">TL</button>
        </div>

        <!-- زر السلة المتقدم في الأعلى -->
        <button class="top-cart-btn" onclick="toggleCartDrawer(true)">
          <i class="fa-solid fa-basket-shopping"></i>
          <span>السلة</span>
          <span class="cart-badge-count" id="badgeCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- تخطيط الصفحة: القائمة الجانبية (Sidebar) مع المحتوى -->
  <div class="layout-container">
    
    <!-- الشريط الجانبي للأقسام بالعربي -->
    <aside class="sidebar-categories">
      <div class="sidebar-title">
        <i class="fa-solid fa-bars-staggered"></i> الأقسام
      </div>
      <div class="cat-list" id="categoriesBar">
        <button class="cat-item-btn active" onclick="filterCategory('الكل', this)">الكل</button>
      </div>
    </aside>

    <!-- المحتوى الرئيسي للوجبات -->
    <div class="main-content-area">
      <main id="menu-container" class="menu-grid">
        <div class="loading-status">
          <i class="fas fa-spinner fa-spin"></i> جاري تحميل القائمة...
        </div>
      </main>
    </div>

  </div>

  <!-- نافذة السلة الجانبية المنسدلة (Drawer) -->
  <div class="cart-overlay" id="cartOverlay" onclick="toggleCartDrawer(false)">
    <div class="cart-drawer-panel" onclick="event.stopPropagation()">
      <div class="drawer-header">
        <div class="drawer-title">
          <i class="fa-solid fa-bag-shopping"></i> حقيبة الطلبات المختارة
        </div>
        <button class="close-drawer" onclick="toggleCartDrawer(false)">&times;</button>
      </div>

      <div class="cart-items-container" id="cartItemsList">
        <div style="text-align: center; color: #86efac; padding: 20px;">السلة فارغة حالياً</div>
      </div>

      <div class="cart-options-area">
        <select id="orderType" class="select-style">
          <option value="توصيل للمنزل">🚴‍♂️ توصيل للمنزل</option>
          <option value="استلام من المطعم">🏪 استلام من المطعم</option>
          <option value="سفري">📦 طعام سفري</option>
          <option value="صالة">🍽️ طلب داخل الصالة</option>
        </select>
        <input type="text" id="orderNotes" class="input-style" placeholder="عنوان التوصيل أو ملاحظات إضافية...">
      </div>

      <div class="cart-total-footer">
        <span>المجموع الكلي:</span>
        <strong id="drawerTotalSum">0 ل.س</strong>
      </div>

      <a href="#" id="whatsappSendBtn" class="whatsapp-send-btn" target="_blank" onclick="sendWhatsAppOrder()">
        <i class="fab fa-whatsapp" style="font-size: 1.2rem;"></i> إرسال الطلب عبر الواتساب
      </a>
    </div>
  </div>

  <script>
    let fullMenuData = [];
    let cart = {}; 
    let currentCategory = 'الكل';
    let currentCurrency = 'syr';

    const SHEET_ID = '1w1jxybn50MUJWVXRH5tWv0AvMdl6KRhXXoLmtgXfuvI';
    const sheetUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
    const restaurantPhoneNumber = "963948893053";

    const fallbackMenu = [
      { title: "وجبة شاورما دبل", price_try: 240, price_s: 72000, category: "وجبات شاورما", description: "شاورما دجاج 220غ مع البطاطا والثومية", image: "" },
      { title: "كوكا كولا", price_try: 50, price_s: 15000, category: "مشروبات", description: "عبوة باردة منعشة", image: "" }
    ];

    async function loadMenu() {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);

        const response = await fetch(sheetUrl, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (!response.ok) throw new Error('فشل الجلب');

        const csvText = await response.text();
        const parsedData = parseCSV(csvText);

        if (parsedData && parsedData.length > 0) {
          fullMenuData = parsedData;
        } else {
          fullMenuData = fallbackMenu;
        }
      } catch (error) {
        fullMenuData = fallbackMenu;
      }

      buildCategoriesNav();
      renderMenuItems();
    }

    function parseCSV(csvText) {
      try {
        const lines = csvText.replace(/^\uFEFF/, '').trim().split(/\r?\n/);
        if (lines.length < 2) return [];

        const delimiter = lines[0].includes(';') ? ';' : ',';
        const headers = lines[0].split(delimiter).map(h => h.replace(/^"|"$/g, '').trim().toLowerCase());

        return lines.slice(1).map(line => {
          if (!line.trim()) return null;
          
          let values = [];
          let insideQuote = false;
          let currentValue = '';

          for (let i = 0; i < line.length; i++) {
            let char = line[i];
            if (char === '"') {
              insideQuote = !insideQuote;
            } else if (char === delimiter && !insideQuote) {
              values.push(currentValue.replace(/^"|"$/g, '').trim());
              currentValue = '';
            } else {
              currentValue += char;
            }
          }
          values.push(currentValue.replace(/^"|"$/g, '').trim());

          let item = {};
          headers.forEach((h, idx) => {
            item[h] = values[idx] || '';
          });

          const priceTryNum = parseFloat((item.price_try || item.pricetry || item.price || '0').toString().replace(/[^0-9.]/g, '')) || 0;
          const priceSNum = parseFloat((item.price_syr || item.pricesyr || item.price_s || '0').toString().replace(/[^0-9.]/g, '')) || 0;

          return {
            title: item.title || item['عنوان'] || '',
            price_try: priceTryNum,
            price_s: priceSNum,
            category: item.category || item['قسم'] || 'وجبات عامة',
            description: item.description || item['وصف'] || 'مجهّزة طازجة يومياً بأعلى جودة',
            image: item.image || ''
          };
        }).filter(item => item && item.title);
      } catch (e) {
        return [];
      }
    }

    function switchCurrency(curr) {
      currentCurrency = curr;
      document.getElementById('btn-syr').classList.toggle('active', curr === 'syr');
      document.getElementById('btn-try').classList.toggle('active', curr === 'try');
      renderMenuItems();
      updateCartUI();
    }

    function buildCategoriesNav() {
      const container = document.getElementById('categoriesBar');
      const cats = ['الكل', ...new Set(fullMenuData.map(i => i.category))];
      
      container.innerHTML = cats.map(cat => `
        <button class="cat-item-btn ${cat === currentCategory ? 'active' : ''}" onclick="filterCategory('${cat}', this)">${cat}</button>
      `).join('');
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll('.cat-item-btn').forEach(p => p.classList.remove('active'));
      if (btn) btn.classList.add('active');
      currentCategory = cat;
      renderMenuItems();
    }

    function renderMenuItems() {
      const container = document.getElementById('menu-container');
      if (!container) return;

      const filtered = fullMenuData.filter(item => {
        if (currentCategory === 'الكل') return true;
        return item.category && item.category.trim().toLowerCase() === currentCategory.toLowerCase();
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div

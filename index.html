<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مطعم عماد الدين | Imad Al-Din Restaurant</title>
  
  <!-- Google Fonts: Cairo & Amiri -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- PapaParse CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --bg-deep: #051811;
      --card-bg: rgba(13, 38, 28, 0.85);
      --gold-primary: #E5A84B;
      --gold-light: #f3c77c;
      --gold-dark: #b87f2a;
      --text-white: #ffffff;
      --text-muted: #b3c7be;
      --border-gold: rgba(229, 168, 75, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-deep);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(229, 168, 75, 0.12) 0%, transparent 60%),
        url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23e5a84b' fill-opacity='0.04'%3E%3Cpath d='M0 0h80v80H0z' fill='none'/%3E%3Cpath d='M40 0l40 40-40 40L0 40zM40 10l30 30-30 30-30-30z'/%3E%3C/g%3E%3C/svg%3E");
      color: var(--text-white);
      min-height: 100vh;
      padding-bottom: 110px;
    }

    /* Header Nav */
    header {
      background: rgba(4, 18, 13, 0.92);
      border-bottom: 1.5px solid var(--gold-primary);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title span {
      color: var(--gold-primary);
      font-family: 'Amiri', serif;
      font-size: 26px;
    }

    .currency-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(229, 168, 75, 0.12);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--gold-primary);
    }

    .currency-pill label {
      font-size: 13px;
      color: var(--gold-primary);
      font-weight: 700;
    }

    .currency-pill select {
      background: #051811;
      color: #ffffff;
      border: none;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }

    /* Hero Banner */
    .hero-banner {
      text-align: center;
      padding: 35px 15px 25px 15px;
      position: relative;
      background: radial-gradient(circle, rgba(14, 46, 34, 0.8) 0%, rgba(5, 24, 17, 0.95) 100%),
                  url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M60 0L120 60L60 120L0 60Z' fill='none' stroke='%23e5a84b' stroke-opacity='0.15' stroke-width='1.5'/%3E%3C/svg%3E");
      border-bottom: 1px solid var(--border-gold);
    }

    .hero-banner h1 {
      font-size: 34px;
      font-weight: 900;
      font-family: 'Amiri', serif;
      margin-bottom: 6px;
    }

    .hero-banner h1 span {
      color: var(--gold-primary);
      text-shadow: 0 0 15px rgba(229, 168, 75, 0.35);
    }

    .hero-banner p {
      font-size: 15px;
      color: var(--text-muted);
    }

    /* Categories Horizontal Scroll */
    .nav-tabs-wrapper {
      padding: 15px 10px;
      overflow-x: auto;
      white-space: nowrap;
      display: flex;
      justify-content: flex-start;
      scrollbar-width: none;
    }

    .nav-tabs-wrapper::-webkit-scrollbar {
      display: none;
    }

    @media (min-width: 992px) {
      .nav-tabs-wrapper {
        justify-content: center;
      }
    }

    .nav-tabs {
      display: inline-flex;
      gap: 10px;
    }

    .tab-item {
      background: rgba(13, 38, 28, 0.9);
      color: var(--text-muted);
      border: 1px solid var(--border-gold);
      padding: 8px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tab-item.active, .tab-item:hover {
      background: var(--gold-primary);
      color: #051811;
      border-color: var(--gold-primary);
      box-shadow: 0 4px 15px rgba(229, 168, 75, 0.35);
      transform: translateY(-2px);
    }

    /* Container Grid */
    .main-container {
      max-width: 1200px;
      margin: 10px auto 40px auto;
      padding: 0 15px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 22px;
    }

    /* Modern Card UI */
    .card-item {
      background: var(--card-bg);
      border-radius: 18px;
      border: 1px solid var(--border-gold);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.35s ease;
      backdrop-filter: blur(5px);
      position: relative;
    }

    .card-item:hover {
      transform: translateY(-8px);
      border-color: var(--gold-primary);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(229, 168, 75, 0.25);
    }

    .card-media {
      position: relative;
      width: 100%;
      height: 185px;
      overflow: hidden;
      background-color: #04120c;
    }

    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card-item:hover .card-media img {
      transform: scale(1.08);
    }

    .price-tag-badge {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(5, 24, 17, 0.9);
      color: var(--gold-primary);
      border: 1px solid var(--gold-primary);
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
    }

    .card-details {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .item-title {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .item-description {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 16px;
      flex-grow: 1;
    }

    /* Buttons & Quantity Controls */
    .btn-add-cart {
      width: 100%;
      padding: 10px;
      background: var(--gold-primary);
      color: #051811;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
    }

    .btn-add-cart:hover {
      background: var(--gold-dark);
      color: #ffffff;
    }

    .qty-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #04120c;
      border: 1.5px solid var(--gold-primary);
      border-radius: 12px;
      padding: 4px;
    }

    .btn-qty {
      background: var(--gold-primary);
      color: #051811;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .btn-qty:hover {
      background: var(--gold-light);
    }

    .qty-num {
      font-weight: 800;
      color: var(--gold-primary);
      font-size: 16px;
    }

    /* Floating Cart Bar */
    .smart-cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(4, 18, 13, 0.96);
      border-top: 2px solid #25d366;
      padding: 14px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.6);
      z-index: 1000;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      backdrop-filter: blur(12px);
    }

    .smart-cart-bar.active {
      transform: translateY(0);
    }

    .cart-summary {
      display: flex;
      flex-direction: column;
    }

    .summary-count {
      color: var(--text-muted);
      font-size: 13px;
    }

    .summary-total {
      color: var(--gold-primary);
      font-weight: 800;
      font-size: 17px;
    }

    .btn-submit-whatsapp {
      background: #25d366;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
      transition: background 0.2s;
    }

    .btn-submit-whatsapp:hover {
      background: #1eb956;
    }

    /* Status Load */
    .status-msg {
      text-align: center;
      padding: 50px 20px;
      color: var(--gold-primary);
      font-size: 18px;
      font-weight: 700;
      grid-column: 1 / -1;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #03100b;
      border-top: 1px solid var(--border-gold);
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 40px;
    }

    footer span {
      color: var(--gold-primary);
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand-title">
      <i class="fa-solid fa-utensils" style="color: var(--gold-primary)"></i>
      مطعم <span>عماد الدين</span>
    </div>
    
    <div class="currency-pill">
      <label for="currency-select"><i class="fa-solid fa-coins"></i> العملة:</label>
      <select id="currency-select" onchange="switchCurrency(this.value)">
        <option value="TRY">ليرة تركية (TL)</option>
        <option value="SYP">ليرة سورية (SYP)</option>
      </select>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="hero-banner">
    <h1>أهلاً بكم في مطعم <span>عماد الدين</span></h1>
    <p>أطيب الوجبات الغربية والشاورما والمناسف والمقبلات - اختر وجباتك وأرسل الطلب عبر الواتساب</p>
  </section>

  <!-- Category Nav -->
  <div class="nav-tabs-wrapper">
    <nav class="nav-tabs">
      <button class="tab-item active" onclick="filterMenuCategory('all')">الكل</button>
      <button class="tab-item" onclick="filterMenuCategory('shawarma-sand')">سندويش شاورما</button>
      <button class="tab-item" onclick="filterMenuCategory('western-sand')">سندويش غربي</button>
      <button class="tab-item" onclick="filterMenuCategory('shawarma-meals')">وجبات شاورما</button>
      <button class="tab-item" onclick="filterMenuCategory('western-meals')">وجبات غربي</button>
      <button class="tab-item" onclick="filterMenuCategory('manasif')">قسم المناسف</button>
      <button class="tab-item" onclick="filterMenuCategory('appetizers')">مقبلات</button>
      <button class="tab-item" onclick="filterMenuCategory('drinks')">مشروبات</button>
    </nav>
  </div>

  <!-- Menu Container -->
  <main class="main-container">
    <div id="menu-grid" class="menu-grid">
      <div class="status-msg">
        <i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل القائمة...
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 جميع الحقوق محفوظة | <span>مطعم عماد الدين</span></p>
    <p style="margin-top: 5px; font-size: 12px; color: #6a8278;">للطلبات والاستفسار: 0948893053</p>
  </footer>

  <!-- Floating Cart Bar -->
  <div id="smart-cart-bar" class="smart-cart-bar">
    <div class="cart-summary">
      <span id="cart-count" class="summary-count">الطلب: 0 عنصر</span>
      <span id="cart-total" class="summary-total">المجموع: 0 TL</span>
    </div>
    <a href="#" id="whatsapp-order-link" class="btn-submit-whatsapp" target="_blank">
      <i class="fa-brands fa-whatsapp"></i> إرسال الطلب
    </a>
  </div>

  <script>
    let fullMenuData = [];
    let cart = {};
    let currentCurrency = "TRY";

    const SHEET_ID = '1w1jxybn50MUJWVXRH5tWv0AvMdl6KRhXXoLmtgXfuvI';
    const sheetUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
    const restaurantPhoneNumber = "963948893053";

    function loadMenuData() {
      Papa.parse(sheetUrl, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          if (results && results.data && results.data.length > 0) {
            fullMenuData = results.data.map(row => {
              let cat = row['category'] || row['القسم'] || 'shawarma-meals';
              if (cat.includes('grilled') || cat.includes('فروج') || cat.includes('grilled-ch...')) {
                cat = 'manasif';
              }

              return {
                title: row['title'] || row['عنوان'] || '',
                price_try: parseFloat((row['price_try'] || row['price'] || '0').toString().replace(/[^0-9.]/g, '')) || 0,
                price_s: parseFloat((row['price_syr'] || row['price_s'] || row['price_syp'] || '0').toString().replace(/[^0-9.]/g, '')) || 0,
                category: cat,
                description: row['description'] || row['وصف'] || '',
                image: row['image'] || row['صورة'] || ''
              };
            }).filter(item => item.title.trim() !== '');

            renderMenuCards(fullMenuData);
          } else {
            document.getElementById('menu-grid').innerHTML = '<div class="status-msg">تعذر العثور على وجبات في القائمة.</div>';
          }
        },
        error: function(err) {
          console.error(err);
          document.getElementById('menu-grid').innerHTML = '<div class="status-msg">خطأ في جلب البيانات، يرجى التأكد من الشيت.</div>';
        }
      });
    }

    function switchCurrency(curr) {
      currentCurrency = curr;
      renderMenuCards(fullMenuData);
      updateCartBar();
    }

    function renderMenuCards(menuData) {
      const grid = document.getElementById('menu-grid');
      if (!grid) return;

      if (menuData.length === 0) {
        grid.innerHTML = '<div class="status-msg">لا توجد عناصر مضافة بعد في هذا القسم.</div>';
        return;
      }

      grid.innerHTML = menuData.map(item => {
        const imageName = item.image ? item.image.trim() : '';
        const imagePath = imageName.startsWith('http') 
          ? imageName 
          : (imageName ? `images/${imageName}` : 'https://images.unsplash.com/photo-1561651823-34feb02250e4?w=500');
        
        const qty = cart[item.title] ? cart[item.title].qty : 0;
        const priceDisplay = currentCurrency === "TRY" 
          ? `${item.price_try} TL` 
          : `${item.price_s} SYP`;

        return `
          <div class="card-item">
            <div class="card-media">
              <img src="${imagePath}" alt="${item.title}" onerror="this.src='https://images.unsplash.com/photo-1561651823-34feb02250e4?w=500'">
              <div class="price-tag-badge">${priceDisplay}</div>
            </div>
            <div class="card-details">
              <h3 class="item-title">${item.title}</h3>
              <p class="item-description">${item.description}</p>
              <div id="btn-box-${encodeURIComponent(item.title)}">
                ${renderCartControls(item, qty)}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderCartControls(item, qty) {
      const titleEsc = encodeURIComponent(item.title);
      if (qty === 0) {
        return `
          <button class="btn-add-cart" onclick="modifyQty('${titleEsc}', 1)">
            <i class="fa-solid fa-cart-plus"></i> إضافة إلى السلة
          </button>
        `;
      } else {
        return `
          <div class="qty-box">
            <button class="btn-qty" onclick="modifyQty('${titleEsc}', ${qty - 1})">-</button>
            <span class="qty-num">${qty}</span>
            <button class="btn-qty" onclick="modifyQty('${titleEsc}', ${qty + 1})">+</button>
          </div>
        `;
      }
    }

    function modifyQty(titleEsc, newQty) {
      const title = decodeURIComponent(titleEsc);
      const item = fullMenuData.find(i => i.title === title);
      if (!item) return;

      if (newQty <= 0) {
        delete cart[title];
      } else {
        cart[title] = { item: item, qty: newQty };
      }

      const btnContainer = document.getElementById(`btn-box-${titleEsc}`);
      if (btnContainer) {
        btnContainer.innerHTML = renderCartControls(item, newQty <= 0 ? 0 : newQty);
      }

      updateCartBar();
    }

    function updateCartBar() {
      const cartBar = document.getElementById('smart-cart-bar');
      const cartCountText = document.getElementById('cart-count');
      const cartTotalText = document.getElementById('cart-total');
      const whatsappLink = document.getElementById('whatsapp-order-link');

      const cartItems = Object.values(cart);
      if (cartItems.length === 0) {
        cartBar.classList.remove('active');
        return;
      }

      cartBar.classList.add('active');

      let totalItems = 0;
      let totalAmount = 0;
      let messageLines = ["مرحبا مطعم عماد الدين، أرغب بتسجيل الطلب التالي:\n"];

      cartItems.forEach(cartItem => {
        const { item, qty } = cartItem;
        totalItems += qty;
        
        const price = currentCurrency === "TRY" ? item.price_try : item.price_s;
        const itemTotal = price * qty;
        totalAmount += itemTotal;

        const currSymbol = currentCurrency === "TRY" ? "TL" : "SYP";
        messageLines.push(`• ${item.title} (العدد: ${qty}) - ${itemTotal} ${currSymbol}`);
      });

      const currSymbol = currentCurrency === "TRY" ? "TL" : "SYP";
      messageLines.push(`\n📌 الإجمالي الكلي: ${totalAmount} ${currSymbol}`);

      cartCountText.innerText = `الطلب: ${totalItems} عناصر`;
      cartTotalText.innerText = `المجموع: ${totalAmount} ${currSymbol}`;

      const whatsappText = encodeURIComponent(messageLines.join('\n'));
      whatsappLink.href = `https://wa.me/${restaurantPhoneNumber}?text=${whatsappText}`;
    }

    function filterMenuCategory(category) {
      document.querySelectorAll('.tab-item').forEach(btn => btn.classList.remove('active'));
      if (window.event && window.event.target) {
        window.event.target.classList.add('active');
      }

      if (category === 'all') {
        renderMenuCards(fullMenuData);
      } else {
        const filtered = fullMenuData.filter(item => {
          if (!item.category) return false;
          const cat = item.category.trim().toLowerCase();

          if (category === 'shawarma-sand') {
            return cat.includes('shawarma-sand') || (cat.includes('shawarma') && cat.includes('sand'));
          } else if (category === 'western-sand') {
            return cat.includes('western-sand') || (cat.includes('west') && cat.includes('sand'));
          } else if (category === 'shawarma-meals') {
            return cat.includes('shawarma-meal') || (cat.includes('shawarma') && cat.includes('meal'));
          } else if (category === 'western-meals') {
            return cat.includes('western-meal') || (cat.includes('west') && cat.includes('meal'));
          } else if (category === 'manasif') {
            return cat.includes('manasif') || cat.includes('grilled') || cat.includes('مناسف') || cat.includes('فروج');
          } else if (category === 'appetizers') {
            return cat.includes('appetizer') || cat.includes('مقبلات') || cat.includes('بطاطا');
          }

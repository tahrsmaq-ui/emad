<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مطعم عماد الدين | Imad Al-Din Restaurant</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:wght@700&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-green: #061c14;
      --card-bg: #0d261c;
      --primary-mustard: #E5A84B;
      --mustard-dark: #c48b36;
      --text-main: #ffffff;
      --text-muted: #c2d6ce;
      --border-color: #E5A84B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-green);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Navigation */
    header {
      background: rgba(6, 23, 17, 0.95);
      border-bottom: 2px solid var(--border-color);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(8px);
    }

    .logo {
      font-size: 26px;
      font-weight: 900;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo span {
      color: var(--primary-mustard);
      font-family: 'Amiri', serif;
    }

    .currency-selector {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0f2c21;
      padding: 6px 14px;
      border-radius: 30px;
      border: 1px solid var(--border-color);
    }

    .currency-selector label {
      font-size: 14px;
      color: var(--primary-mustard);
      font-weight: 700;
    }

    .currency-selector select {
      background: #061711;
      color: #ffffff;
      border: 1px solid var(--border-color);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    /* Hero Section مع الزخرفة الهندسية الإسلامية العلوية الفخمة */
    .hero {
      text-align: center;
      padding: 70px 20px 50px 20px;
      position: relative;
      background-color: #051610;
      background-image: 
        url("data:image/svg+xml,%3Csvg width='160' height='80' viewBox='0 0 160 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23E5A84B' stroke-width='1.2' stroke-opacity='0.6'%3E%3Cpath d='M80 0 L100 20 L120 0 L140 20 L160 0 L160 40 L140 20 L120 40 L100 20 L80 40 L60 20 L40 40 L20 20 L0 40 L0 0 L20 20 L40 0 L60 20 Z'/%3E%3Cpath d='M0 40 L20 60 L40 40 L60 60 L80 40 L100 60 L120 40 L140 60 L160 40 L160 80 L140 60 L120 80 L100 60 L80 80 L60 60 L40 80 L20 60 L0 80 Z'/%3E%3Ccircle cx='80' cy='40' r='15'/%3E%3Ccircle cx='0' cy='40' r='15'/%3E%3Ccircle cx='160' cy='40' r='15'/%3E%3C/g%3E%3C/svg%3E"),
        linear-gradient(180deg, #09261b 0%, #061711 100%);
      background-repeat: repeat-x, no-repeat;
      background-position: top center, center;
      border-bottom: 2px solid var(--primary-mustard);
      box-shadow: inset 0 -15px 25px rgba(0,0,0,0.5);
    }

    .hero::after {
      content: '';
      position: absolute;
      top: 80px;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary-mustard), transparent);
    }

    .hero h1 {
      font-size: 42px;
      font-weight: 900;
      color: var(--text-main);
      margin-bottom: 12px;
      font-family: 'Amiri', serif;
      margin-top: 10px;
    }

    .hero h1 span {
      color: var(--primary-mustard);
      text-shadow: 0 0 12px rgba(229, 168, 75, 0.4);
    }

    .hero p {
      font-size: 18px;
      color: var(--text-muted);
      max-width: 700px;
      margin: 0 auto;
    }

    /* Container & Tabs */
    .container {
      max-width: 1200px;
      margin: 30px auto 60px auto;
      padding: 0 20px;
      flex: 1;
    }

    .category-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 15px;
      margin-bottom: 30px;
      scrollbar-width: thin;
      scrollbar-color: var(--primary-mustard) transparent;
    }

    .tab-btn {
      background: #0f2c21;
      color: var(--text-main);
      border: 1px solid rgba(229, 168, 75, 0.4);
      padding: 8px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.3s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--primary-mustard);
      color: #000;
      border-color: var(--primary-mustard);
      box-shadow: 0 4px 12px rgba(229, 168, 75, 0.3);
    }

    /* Grid & Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 25px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(229, 168, 75, 0.3);
      border-radius: 14px;
      overflow: hidden;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: var(--primary-mustard);
      box-shadow: 0 8px 25px rgba(229, 168, 75, 0.25);
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      height: 190px;
      background-color: #061711;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-bottom: 2px solid var(--primary-mustard);
    }

    .card-content {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 18px;
      flex: 1;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .price-tag {
      font-size: 17px;
      font-weight: 800;
      color: var(--primary-mustard);
      background: rgba(229, 168, 75, 0.15);
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--primary-mustard);
    }

    .btn-whatsapp {
      background-color: #25D366;
      color: #ffffff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.3s ease;
    }

    .btn-whatsapp:hover {
      background-color: #1eb956;
    }

    .loading {
      text-align: center;
      padding: 50px;
      font-size: 20px;
      color: var(--primary-mustard);
      grid-column: 1 / -1;
    }

    /* Footer */
    footer {
      background: #04120d;
      text-align: center;
      padding: 25px;
      border-top: 1px solid var(--primary-mustard);
      color: #90a49c;
      font-size: 14px;
      margin-top: auto;
    }

    footer p span {
      color: var(--primary-mustard);
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 12px;
      }
      .hero h1 {
        font-size: 30px;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="logo">
      <i class="fa-solid fa-utensils" style="color: var(--primary-mustard)"></i>
      مطعم <span>عماد الدين</span>
    </div>
    
    <div class="currency-selector">
      <label for="currency">العملة:</label>
      <select id="currency" onchange="updateView()">
        <option value="TRY">ليرة تركية (TL)</option>
        <option value="SYP">ليرة سورية (SYP)</option>
      </select>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>أهلاً بكم في مطعم <span>عماد الدين</span></h1>
    <p>أطيب المأكولات السريعة والشاورما والمناسف والغربيات بأفضل مذاق وأعلى جودة</p>
  </section>

  <!-- Main Container -->
  <main class="container">
    <div class="category-tabs" id="category-tabs">
      <button class="tab-btn active" onclick="filterCategory('all', this)">الكل</button>
    </div>
    
    <div class="grid" id="meals-grid">
      <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل القائمة من الشيت...</div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 جميع الحقوق محفوظة | <span>مطعم عماد الدين</span></p>
    <p style="margin-top: 5px; font-size: 12px; color: #666;">للطلبات والاستفسار: 0948893053</p>
  </footer>

  <!-- JavaScript Code (قراءة الرابط المباشر بدقة) -->
  <script>
    const SHEET_ID = '1w1jxybn50MUJWVXRH5tWv0AvMdl6KRhXXoLmtgXfuvI';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
    const WHATSAPP_NUMBER = "963948893053";

    let allMeals = [];
    let activeCategory = 'all';

    async function fetchMeals() {
      try {
        const response = await fetch(CSV_URL);
        const data = await response.text();
        parseCSV(data);
      } catch (error) {
        console.error('Error fetching sheet:', error);
        document.getElementById('meals-grid').innerHTML = '<div class="loading">عذراً، تأكد من مشاركة ملف الشيت أو تفعيل النشر علناً ليعمل الاتصال بنجاح.</div>';
      }
    }

    function parseCSV(text) {
      const lines = text.split('\n');
      allMeals = [];

      for (let i = 1; i < lines.length; i++) {
        const row = lines[i].trim();
        if (!row) continue;
        
        const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
        if (cols.length >= 5) {
          let cat = cols[3]?.replace(/"/g, '').trim() || 'عام';
          if (cat === 'grilled-ch...' || cat.includes('grilled')) {
            cat = 'manasif';
          }

          allMeals.push({
            title: cols[0]?.replace(/"/g, '').trim() || '',
            priceTRY: cols[1]?.replace(/"/g, '').trim() || '0',
            priceSYP: cols[2]?.replace(/"/g, '').trim() || '0',
            category: cat,
            desc: cols[4]?.replace(/"/g, '').trim() || '',
            image: cols[5]?.replace(/"/g, '').trim() || 'https://images.unsplash.com/photo-1561651823-34feb02250e4?w=600'
          });
        }
      }

      renderCategories();
      updateView();
    }

    function renderCategories() {
      const categories = ['all', ...new Set(allMeals.map(m => m.category).filter(Boolean))];
      const tabsContainer = document.getElementById('category-tabs');
      
      const categoryNames = {
        'all': 'الكل',
        'shawarma-meals': 'وجبات الشاورما',
        'western-meals': 'الوجبات الغربية',
        'shawarma-sand': 'سندويش شاورما',
        'western-sand': 'سندويش غريب',
        'appetizers': 'مقبلات وبطاطا',
        'manasif': 'قسم المناسف'
      };

      tabsContainer.innerHTML = categories.map(cat => `
        <button class="tab-btn ${cat === 'all' ? 'active' : ''}" onclick="filterCategory('${cat}', this)">
          ${categoryNames[cat] || cat}
        </button>
      `).join('');
    }

    function filterCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateView();
    }

    function updateView() {
      const currency = document.getElementById('currency').value;
      const grid = document.getElementById('meals-grid');
      
      const filtered = activeCategory === 'all' 
        ? allMeals 
        : allMeals.filter(m => m.category === activeCategory);

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="loading">لا توجد وجبات في هذا القسم.</div>';
        return;
      }

      grid.innerHTML = filtered.map(meal => {
        const isTRY = currency === 'TRY';
        const priceVal = isTRY ? meal.priceTRY : meal.priceSYP;
        const priceFormatted = isTRY ? `${priceVal} TL` : `${priceVal} ل.س`;
        
        const waText = encodeURIComponent(`مرحباً مطعم عماد الدين، أرغب بطلب:\n- ${meal.title}\n- السعر: ${priceFormatted}`);
        const waLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${waText}`;

        const imgSrc = meal.image.startsWith('http') 
          ? meal.image 
          : 'https://images.unsplash.com/photo-1561651823-34feb02250e4?auto=format&fit=crop&w=600&q=80';

        return `
          <div class="card">
            <div class="card-img-wrapper">
              <img src="${imgSrc}" alt="${meal.title}" onerror="this.src='https://images.unsplash.com/photo-1561651823-34feb02250e4?auto=format&fit=crop&w=600&q=80'">
            </div>
            <div class="card-content">
              <h3 class="card-title">${meal.title}</h3>
              <p class="card-desc">${meal.desc}</p>
              <div class="card-footer">
                <span class="price-tag">${priceFormatted}</span>
                <a href="${waLink}" target="_blank" class="btn-whatsapp">
                  <i class="fa-brands fa-whatsapp"></i> طلب
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    window.onload = fetchMeals;
  </script>
</body>
</html>

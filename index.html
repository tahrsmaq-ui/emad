<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مطعم عماد الدين | Imad Al-Din Restaurant</title>
  
  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0a0a0a;
      --card-bg: #141414;
      /* درجة الأصفر الخردلي المطفي المطابقة للصورة */
      --primary-mustard: #E5A84B; 
      --mustard-dark: #c48b36;
      --text-main: #ffffff;
      --text-muted: #b0b0b0;
      --border-color: #E5A84B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Navigation */
    header {
      background: #111111;
      border-bottom: 2px solid var(--border-color);
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 26px;
      font-weight: 900;
      color: var(--text-main);
    }

    .logo span {
      color: var(--primary-mustard);
    }

    .currency-selector {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1a1a1a;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .currency-selector label {
      font-size: 14px;
      color: var(--primary-mustard);
      font-weight: 700;
    }

    .currency-selector select {
      background: #0a0a0a;
      color: #ffffff;
      border: 1px solid var(--border-color);
      padding: 5px 12px;
      border-radius: 5px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    /* Hero Banner */
    .hero {
      text-align: center;
      padding: 60px 20px 30px 20px;
      background: radial-gradient(circle, #1a150d 0%, #0a0a0a 100%);
    }

    .hero h1 {
      font-size: 40px;
      font-weight: 900;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .hero h1 span {
      color: var(--primary-mustard);
    }

    .hero p {
      font-size: 17px;
      color: var(--text-muted);
    }

    .divider {
      width: 90px;
      height: 3px;
      background-color: var(--primary-mustard);
      margin: 20px auto 0 auto;
      border-radius: 2px;
    }

    /* Container & Section */
    .container {
      max-width: 1150px;
      margin: 30px auto 60px auto;
      padding: 0 25px;
      flex: 1;
    }

    .section-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary-mustard);
      border-right: 4px solid var(--primary-mustard);
      padding-right: 12px;
      margin-bottom: 30px;
    }

    /* Grid & Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 25px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid #262626;
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: var(--primary-mustard);
      box-shadow: 0 6px 20px rgba(229, 168, 75, 0.2);
    }

    .card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      border-bottom: 2px solid var(--primary-mustard);
    }

    .card-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 18px;
      flex: 1;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid #222;
    }

    .price-tag {
      font-size: 17px;
      font-weight: 800;
      color: var(--primary-mustard);
      background: rgba(229, 168, 75, 0.12);
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--primary-mustard);
    }

    .btn-order {
      background-color: var(--primary-mustard);
      color: #000000;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      transition: background-color 0.3s ease;
    }

    .btn-order:hover {
      background-color: var(--mustard-dark);
    }

    /* Footer */
    footer {
      background: #0d0d0d;
      text-align: center;
      padding: 20px;
      border-top: 1px solid var(--primary-mustard);
      color: #888;
      font-size: 14px;
      margin-top: auto;
    }

    footer p span {
      color: var(--primary-mustard);
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 15px;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="logo">مطعم <span>عماد الدين</span></div>
    
    <div class="currency-selector">
      <label for="currency">اختر العملة:</label>
      <select id="currency" onchange="updatePrices()">
        <option value="TRY">ليرة تركية (TL)</option>
        <option value="SYP">ليرة سورية (SYP)</option>
      </select>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>أهلاً بكم في مطعم <span>عماد الدين</span></h1>
    <p>أطيب المأكولات السريعة والغربية بأعلى جودة وأفضل طعم</p>
    <div class="divider"></div>
  </section>

  <!-- Main Content Area -->
  <main class="container">
    <h2 class="section-title">قائمة الوجبات</h2>
    
    <div class="grid" id="meals-grid">
      <!-- Cards rendered by JS -->
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 جميع الحقوق محفوظة | <span>مطعم عماد الدين</span></p>
  </footer>

  <!-- JavaScript -->
  <script>
    const meals = [
      {
        id: 1,
        title: "وجبة شاورما اكسترا",
        desc: "شاورما دجاج ممتازة مع جبنة موزاريلا + فطر + بطاطا + ثوم + مخلل + دبس رمان",
        priceTRY: 200,
        priceSYP: 600,
        image: "https://images.unsplash.com/photo-1561651823-34feb02250e4?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 2,
        title: "وجبة كريسبي",
        desc: "قطع دجاج كريسبي مقرمشة + بطاطا + صوص ثوم + كولسلو + مخلل",
        priceTRY: 220,
        priceSYP: 660,
        image: "https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 3,
        title: "وجبة زنجر حار",
        desc: "صدر دجاج زنجر مقرمش مع الصوص الحار + جبنة شيدر + بطاطا + كولسلو",
        priceTRY: 230,
        priceSYP: 690,
        image: "https://images.unsplash.com/photo-1625813506062-0aeb1d7a094b?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 4,
        title: "وجبة فاهيتا",
        desc: "صدر دجاج مشوي مع الذرة والفلفل الرومي والبصل والجبنة الذائبة",
        priceTRY: 250,
        priceSYP: 750,
        image: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 5,
        title: "وجبة مكسيكانو",
        desc: "قطع دجاج حارة على الطريقة المكسيكية مع الفطر والبصل والصوص الخاص",
        priceTRY: 210,
        priceSYP: 630,
        image: "https://images.unsplash.com/photo-1509722747041-616f39b57569?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 6,
        title: "برغر دجاج دبل",
        desc: "شريحتا دجاج مع الجبنة والشريحة الذهبية والصوص الخاص مع البطاطا",
        priceTRY: 190,
        priceSYP: 570,
        image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80"
      }
    ];

    function renderMeals(selectedCurrency) {
      const grid = document.getElementById("meals-grid");
      grid.innerHTML = "";

      meals.forEach(meal => {
        const price = selectedCurrency === "TRY" 
          ? `${meal.priceTRY} TL` 
          : `${meal.priceSYP} ل.س`;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${meal.image}" alt="${meal.title}">
          <div class="card-content">
            <h3 class="card-title">${meal.title}</h3>
            <p class="card-desc">${meal.desc}</p>
            <div class="card-footer">
              <span class="price-tag">${price}</span>
              <button class="btn-order">اطلب الآن</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function updatePrices() {
      const currencySelect = document.getElementById("currency");
      renderMeals(currencySelect.value);
    }

    window.onload = function() {
      renderMeals("TRY");
    };
  </script>
</body>
</html>

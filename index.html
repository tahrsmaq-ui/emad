<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم عماد الدين | Emad El-Din Restaurant</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #07120a;
            --bg-card: rgba(14, 34, 23, 0.85);
            --gold-primary: #d4af37;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --text-light: #f5f8f6;
            --text-muted: #9bb39e;
            --radius-xl: 20px;
            --radius-lg: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(11, 36, 23, 0.6) 0%, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            padding-bottom: 110px;
        }

        /* --- Header --- */
        .header {
            background: rgba(7, 18, 10, 0.92);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
            padding: 15px 20px;
        }

        .header-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 46px;
            height: 46px;
            background: var(--gold-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-dark);
            font-size: 20px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.35);
        }

        .brand-text h1 {
            font-size: 20px;
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text p {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* --- Controls --- */
        .controls-area {
            max-width: 1000px;
            margin: 20px auto 10px;
            padding: 0 20px;
        }

        .search-box-wrapper {
            position: relative;
        }

        .search-box-wrapper i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold-primary);
        }

        .search-input {
            width: 100%;
            padding: 14px 45px 14px 15px;
            background: rgba(14, 34, 23, 0.65);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: var(--radius-lg);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.2);
        }

        .cat-scroll-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-top: 15px;
            padding-bottom: 5px;
            scrollbar-width: none;
        }

        .cat-btn {
            padding: 9px 20px;
            background: rgba(14, 34, 23, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 25px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--gold-gradient);
            color: var(--bg-dark);
            font-weight: 800;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        /* --- Menu Grid --- */
        .menu-grid {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 20px;
        }

        .food-card {
            background: var(--bg-card);
            border: 1px solid rgba(212, 175, 55, 0.18);
            border-radius: var(--radius-xl);
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s, border-color 0.3s;
            backdrop-filter: blur(8px);
        }

        .food-card:hover {
            transform: translateY(-4px);
            border-color: var(--gold-primary);
        }

        .food-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .food-name {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
        }

        .food-cat-badge {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-primary);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 11px;
        }

        .food-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .food-foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .food-price {
            font-size: 18px;
            font-weight: 900;
            color: var(--gold-primary);
        }

        .add-cart-btn {
            background: var(--gold-gradient);
            color: var(--bg-dark);
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-lg);
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .add-cart-btn:active {
            transform: scale(0.95);
        }

        /* --- Floating Cart Bar --- */
        .cart-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 550px;
            background: rgba(11, 36, 23, 0.96);
            border: 1px solid var(--gold-primary);
            backdrop-filter: blur(20px);
            border-radius: 35px;
            padding: 12px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.8);
            z-index: 150;
            cursor: pointer;
            display: none;
        }

        .cart-bar-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .cart-badge {
            background: var(--gold-primary);
            color: var(--bg-dark);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 15px;
        }

        .cart-bar-text {
            display: flex;
            flex-direction: column;
        }

        .cart-bar-label {
            font-size: 11px;
            color: var(--text-muted);
        }

        .cart-bar-total {
            font-size: 16px;
            font-weight: 800;
            color: #fff;
        }

        .open-cart-btn {
            background: var(--gold-gradient);
            color: var(--bg-dark);
            border: none;
            padding: 9px 18px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --- Drawer --- */
        .cart-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 200;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .cart-modal-overlay.active {
            display: block;
            opacity: 1;
        }

        .cart-drawer {
            position: fixed;
            bottom: -100%;
            left: 0;
            right: 0;
            max-width: 600px;
            margin: 0 auto;
            background: #0b1f14;
            border-top: 2px solid var(--gold-primary);
            border-radius: 25px 25px 0 0;
            padding: 20px;
            z-index: 201;
            transition: bottom 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .cart-modal-overlay.active .cart-drawer {
            bottom: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .drawer-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--gold-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-drawer-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
        }

        .cart-items-list {
            overflow-y: auto;
            margin: 15px 0;
            max-height: 250px;
            padding-left: 5px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(14, 34, 23, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .item-details h4 {
            font-size: 15px;
            font-weight: 700;
        }

        .item-details span {
            font-size: 13px;
            color: var(--gold-primary);
            font-weight: 800;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(7, 18, 10, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 3px 8px;
        }

        .qty-btn {
            background: transparent;
            border: none;
            color: var(--gold-primary);
            font-size: 16px;
            font-weight: bold;
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .cart-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .option-select, .note-input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(14, 34, 23, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .send-whatsapp-btn {
            width: 100%;
            background: #25d366;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        .status-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-container">
            <div class="brand-box">
                <div class="brand-icon"><i class="fa-solid fa-utensils"></i></div>
                <div class="brand-text">
                    <h1>مطعم عماد الدين</h1>
                    <p>أشهى الوجبات والمأكولات الغربية والشرقية</p>
                </div>
            </div>
            <i class="fa-solid fa-crown" style="color: var(--gold-primary); font-size: 20px;"></i>
        </div>
    </header>

    <div class="controls-area">
        <div class="search-box-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن وجبة..." oninput="renderMenu()">
        </div>
        <div class="cat-scroll-bar" id="categoriesBar"></div>
    </div>

    <main class="menu-grid" id="menuContainer"></main>

    <div class="cart-bar" id="cartBar" onclick="toggleCartDrawer(true)">
        <div class="cart-bar-info">
            <div class="cart-badge" id="cartBadgeCount">0</div>
            <div class="cart-bar-text">
                <span class="cart-bar-label">سلة الطلبات</span>
                <span class="cart-bar-total" id="cartBarTotal">0 ل.س</span>
            </div>
        </div>
        <button class="open-cart-btn">
            عرض السلة <i class="fa-solid fa-basket-shopping"></i>
        </button>
    </div>

    <div class="cart-modal-overlay" id="cartOverlay" onclick="toggleCartDrawer(false)">
        <div class="cart-drawer" onclick="event.stopPropagation()">
            <div class="drawer-header">
                <div class="drawer-title">
                    <i class="fa-solid fa-bag-shopping"></i> قائمة الطلبات المختارة
                </div>
                <button class="close-drawer-btn" onclick="toggleCartDrawer(false)">&times;</button>
            </div>

            <div class="cart-items-list" id="cartItemsList"></div>

            <div class="cart-options">
                <select id="orderType" class="option-select">
                    <option value="توصيل للمنزل">🚴‍♂️ توصيل للمنزل</option>
                    <option value="استلام من المطعم">🏪 الاستلام من المطعم</option>
                    <option value="سفري">📦 طعام سفري</option>
                    <option value="صالة">🍽️ طلب صالة</option>
                </select>
                <input type="text" id="orderNotes" class="note-input" placeholder="عنوان التوصيل / ملاحظات إضافية على الطلب...">
            </div>

            <button class="send-whatsapp-btn" onclick="sendOrderToWhatsApp()">
                إرسال الطلب عبر الواتساب <i class="fa-brands fa-whatsapp" style="font-size: 20px;"></i>
            </button>
        </div>
    </div>

    <script>
        const SHEET_ID = '1w1jxybn50MUJWVXRH5tWv0AvMdl6KRhXXoLmtgXfuvI';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
        const WHATSAPP_NUMBER = '963948893053';

        const categoryNames = {
            'shawarma-meals': 'وجبات شاورما',
            'shawarma-sand': 'سندويش شاورما',
            'western-meals': 'وجبات غربية',
            'western-sand': 'سندويش غربي',
            'appetizers': 'مقبلات وبطاطا',
            'drinks': 'مشروبات'
        };

        const fallbackData = [
            { name: "وجبة شاورما عادي", price: 450, category: "وجبات شاورما", desc: "شاورما دجاج 110غ" },
            { name: "وجبة شاورما دبل", price: 720, category: "وجبات شاورما", desc: "شاورما دجاج 220غ + بطاطا" },
            { name: "وجبة كريسبي عادي", price: 660, category: "وجبات غربية", desc: "4 قطع فتيلة صدر + بطاطا" },
            { name: "كوكا كولا", price: 210, category: "مشروبات", desc: "مشروب بارد" }
        ];

        let menuData = [];
        let cart = {};
        let currentCategory = 'الكل';

        // محول CSV فائق الأمان لا يستسلم للأخطاء البرمجية
        function safeParseCSV(text) {
            try {
                let lines = text.split(/\r\n|\n/);
                if (lines.length < 2) return null;

                let results = [];
                for (let i = 1; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (!line) continue;

                    // تقسيم السطر بحسب الفواصل مع التعامل السليم مع النصوص
                    let cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"\vert{}"$/g, '').trim());
                    
                    if (cols.length > 0 && cols[0] && cols[0] !== 'title') {
                        let name = cols[0];
                        let rawPriceSyr = cols[2];
                        let rawPriceTry = cols[1];
                        let rawCat = cols[3] || 'عام';
                        let desc = cols[4] || 'وجبة طازجة ومجهزة يومياً بأعلى جودة';

                        let price = parseFloat(rawPriceSyr) || parseFloat(rawPriceTry) || 0;
                        let catName = categoryNames[rawCat] || rawCat;

                        results.push({
                            name: name,
                            price: price,
                            category: catName,
                            desc: desc
                        });
                    }
                }
                return results.length > 0 ? results : null;
            } catch (err) {
                console.error("CSV error:", err);
                return null;
            }
        }

        async function loadMenu() {
            try {
                let response = await fetch(CSV_URL);
                if (!response.ok) throw new Error("HTTP error");
                let csvText = await response.text();
                let parsed = safeParseCSV(csvText);

                if (parsed) {
                    menuData = parsed;
                } else {
                    menuData = fallbackData;
                }
            } catch (e) {
                console.warn("استخدام القائمة البديلة الحية:", e);
                menuData = fallbackData;
            }

            buildCategories();
            renderMenu();
        }

        function buildCategories() {
            const catsNav = document.getElementById('categoriesBar');
            const categories = ['الكل', ...new Set(menuData.map(item => item.category))];
            
            catsNav.innerHTML = categories.map((cat, idx) => `
                <button class="cat-btn ${idx === 0 ? 'active' : ''}" onclick="selectCategory('${cat}', this)">${cat}</button>
            `).join('');
        }

        function selectCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = cat;
            renderMenu();
        }

        function renderMenu() {
            const c

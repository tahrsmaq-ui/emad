<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مطعم عماد الدين - Imad Al-Din Restaurant</title>
  <style>
    /* Global Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0d0d0d 0%, #1a0303 50%, #050505 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header & Navigation */
    header {
      background-color: rgba(15, 15, 15, 0.95);
      border-bottom: 2px solid #b30000;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(179, 0, 0, 0.3);
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      color: #e60000;
      text-shadow: 0 0 10px rgba(230, 0, 0, 0.5);
    }

    .logo span {
      color: #ffcc00;
    }

    .currency-selector {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #262626;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #b30000;
    }

    .currency-selector label {
      font-size: 14px;
      color: #ddd;
    }

    .currency-selector select {
      background: #111;
      color: #ffcc00;
      border: 1px solid #b30000;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
      outline: none;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 50px 20px;
      background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                  radial-gradient(circle, #800000 0%, #000000 100%);
      border-bottom: 1px solid #333;
    }

    .hero h1 {
      font-size: 38px;
      color: #ff3333;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 18px;
      color: #ccc;
    }

    /* Main Container */
    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      flex: 1;
    }

    .section-title {
      font-size: 24px;
      border-right: 4px solid #e60000;
      padding-right: 12px;
      margin-bottom: 25px;
      color: #ffcc00;
    }

    /* Meals Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    }

    .card {
      background: #141414;
      border: 1px solid #2a0000;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(230, 0, 0, 0.4);
      border-color: #e60000;
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-bottom: 2px solid #b30000;
    }

    .card-content {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 20px;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 15px;
      line-height: 1.4;
      flex: 1;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .price-tag {
      font-size: 18px;
      font-weight: bold;
      color: #ffcc00;
      background: #2a0505;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #800000;
    }

    .btn-order {
      background: linear-gradient(45deg, #b30000, #ff1a1a);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }

    .btn-order:hover {
      background: linear-gradient(45deg, #e60000, #ff4d4d);
    }

    /* Footer */
    footer {
      background-color: #0a0a0a;
      text-align: center;
      padding: 20px;
      border-top: 1px solid #333;
      color: #777;
      font-size: 14px;
      margin-top: 40px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 15px;
      }
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <header>
    <div class="logo">مطعم <span>عماد الدين</span></div>
    
    <!-- Currency Selector Dropdown -->
    <div class="currency-selector">
      <label for="currency">اختر العملة:</label>
      <select id="currency" onchange="updatePrices()">
        <option value="TRY">ليرة تركية (TRY)</option>
        <option value="SYP">ليرة سورية (SYP)</option>
      </select>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="hero">
    <h1>أهلاً بكم في مطعم عماد الدين</h1>
    <p>أطيب المأكولات السريعة والغربية بأعلى جودة وأفضل طعم</p>
  </section>

  <!-- Main Content -->
  <main class="container">
    <h2 class="section-title">قائمة الوجبات</h2>
    
    <div class="grid" id="meals-grid">
      <!-- Cards will be dynamically loaded from JavaScript -->
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 مطعم عماد الدين - جميع الحقوق محفوظة</p>
  </footer>

  <!-- JavaScript Code -->
  <script>
    // قائمة الوجبات مع أسعار العملات المختلفة
    const meals = [
      {
        id: 1,
        title: "وجبة شاورما اكسترا",
        desc: "شاورما دجاج ممتازة مع جبنة موزاريلا + فطر + بطاطا + ثوم + مخلل + دبس رمان",
        priceTRY: 200,
        priceSYP: 600,
        image: "https://images.unsplash.com/photo-1561651823-34feb02250e4?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: 2,
        title: "وجبة كريسبي",
        desc: "قطغ دجاج كريسبي مقرمشة + بطاطا + صوص ثوم + كولسلو + مخلل",
        priceTRY: 220,
        priceSYP: 660,
        image: "https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: 3,
        title: "وجبة زنجر حار",
        desc: "صدر دجاج زنجر مقرمش مع الصوص الحار + جبنة شيدر + بطاطا + كولسلو",
        priceTRY: 230,
        priceSYP: 690,
        image: "https://images.unsplash.com/photo-1625813506062-0aeb1d7a094b?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: 4,
        title: "وجبة فاهيتا",
        desc: "صدر دجاج مشوي مع الذرة والفلفل الرومي والبصل والجبنة الذائبة",
        priceTRY: 250,
        priceSYP: 750,
        image: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: 5,
        title: "وجبة مكسيكانو",
        desc: "قطع دجاج حارة على الطريقة المكسيكية مع الفطر والبصل والصوص الخاص",
        priceTRY: 210,
        priceSYP: 630,
        image: "https://images.unsplash.com/photo-1509722747041-616f39b57569?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: 6,
        title: "برغر دجاج دبل",
        desc: "شريحتا دجاج مع الجبنة والشريحة الذهبية والصوص الخاص مع البطاطا",
        priceTRY: 190,
        priceSYP: 570,
        image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=80"
      }
    ];

    // دالة عرض الوجبات حسب العملة المحددة
    function renderMeals(selectedCurrency) {
      const grid = document.getElementById("meals-grid");
      grid.innerHTML = "";

      meals.forEach(meal => {
        const price = selectedCurrency === "TRY" 
          ? `${meal.priceTRY} TL` 
          : `${meal.priceSYP} ل.س`;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${meal.image}" alt="${meal.title}">
          <div class="card-content">
            <h3 class="card-title">${meal.title}</h3>
            <p class="card-desc">${meal.desc}</p>
            <div class="card-footer">
              <span class="price-tag">${price}</span>
              <button class="btn-order">طلب الآن</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // دالة التحديث فور تغيير القائمة المنسدلة
    function updatePrices() {
      const currencySelect = document.getElementById("currency");
      renderMeals(currencySelect.value);
    }

    // تشغيل الصفحة لأول مرة بفرز العملة الافتراضية
    window.onload = function() {
      renderMeals("TRY");
    };
  </script>
</body>
</html>
